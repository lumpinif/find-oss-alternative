<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find OSS Alternative Examples</title>
    <style>
      :root {
        --bg: #101214;
        --surface: #181c1f;
        --text: #f4f1e8;
        --muted: #a8b0ae;
        --green: #52d6a3;
        --amber: #f2b84b;
        --line: rgba(244, 241, 232, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      main {
        width: min(920px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }
      .eyebrow {
        color: var(--green);
        font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 14px 0 16px;
        font-size: clamp(42px, 8vw, 78px);
        line-height: 0.98;
        letter-spacing: 0;
      }
      p {
        max-width: 680px;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.5;
      }
      .examples {
        display: grid;
        gap: 14px;
        margin-top: 40px;
      }
      a.example {
        display: block;
        border: 1px solid var(--line);
        background: var(--surface);
        color: inherit;
        padding: 22px;
        text-decoration: none;
      }
      a.example:hover {
        border-color: rgba(82, 214, 163, 0.7);
      }
      .example strong {
        display: block;
        margin-bottom: 8px;
        color: var(--amber);
        font-size: 21px;
      }
      .example span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Find OSS Alternative</div>
      <h1>Example dashboards</h1>
      <p>
        Open-source precedent reports that show what an agent studies before it
        designs or builds.
      </p>
      <section class="examples" aria-label="Example dashboards">
        <a class="example" href="./typeless-report.html">
          <strong>Free, open-source Typeless alternative</strong>
          <span>Ranked precedents, query families, license notes, and build decisions.</span>
        </a>
      </section>
    </main>
  </body>
</html>
